services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bnb_webapp
    ports:
      - "8000:8000"
    volumes:
      - ./src:/var/www
    depends_on:
      - mysql
    env_file:
      - .env
    working_dir: /var/www
    command: php -S 0.0.0.0:8000

  mysql:
    image: mysql:8
    container_name: bnb_webapp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: